<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="864" viewBox="0 0 1536 864" role="img" aria-labelledby="title desc"><title id="title">購買 入力区分ごとのデータ入力フロー</title><desc id="desc">①購入内容、②発注条件、③納品実績、④在庫使用、⑤請求と支払予定、随時⑥移管と変更。各区分の入力データと前払い・直送・分納の分岐。</desc><defs><marker id="arrow-7594ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#7594ab"/></marker><marker id="arrow-8261b1" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#8261b1"/></marker></defs><rect width="1536" height="864" fill="white"/><g font-family="Noto Sans CJK JP, Meiryo, sans-serif"><text x="43.2" y="59.84" font-size="37.333333333333336" fill="#17364d" font-weight="700" text-anchor="start">購買｜入力区分ごとに入力するデータ</text><text x="45.12" y="107.52000000000001" font-size="20.0" fill="#527089" font-weight="400" text-anchor="start">必要な入力区分へ移動し、同じ発注・明細を引き継いで入力します。</text><rect x="43.2" y="158.39999999999998" width="331.20000000000005" height="360.0" rx="7" fill="#eef6ff" stroke="#b5cfe5"/><text x="58.56" y="194.88" font-size="24.0" fill="#1670b2" font-weight="700" text-anchor="start">① 購入内容・発注準備</text><text x="58.56" y="226.88" font-size="17.333333333333332" fill="#527089" font-weight="400" text-anchor="start">何を・どの案件のために買うか</text><text x="58.56" y="277.44" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・購入区分（案件／在庫）</text><text x="58.56" y="309.12" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・使用案件</text><text x="58.56" y="340.8" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・仕入先</text><text x="58.56" y="372.47999999999996" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・購買担当者（自社）</text><text x="58.56" y="404.15999999999997" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・製品名・型番</text><text x="58.56" y="435.84" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・数量・単位</text><text x="58.56" y="467.52" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・在庫／費用区分・備考</text><text x="58.56" y="494.4" font-size="14.0" fill="#1670b2" font-weight="700" text-anchor="start">在庫向けは、案件未指定で入力できます。</text><rect x="414.72" y="158.39999999999998" width="331.20000000000005" height="360.0" rx="7" fill="#eef6ff" stroke="#b5cfe5"/><text x="430.08000000000004" y="194.88" font-size="24.0" fill="#1670b2" font-weight="700" text-anchor="start">② 発注・納期確認</text><text x="430.08000000000004" y="226.88" font-size="17.333333333333332" fill="#527089" font-weight="400" text-anchor="start">価格・納品・支払条件を決める</text><text x="430.08000000000004" y="277.44" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・発注番号・発注日</text><text x="430.08000000000004" y="309.12" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・単価・税区分</text><text x="430.08000000000004" y="340.8" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・納品予定日</text><text x="430.08000000000004" y="372.47999999999996" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・納品方法・納品先</text><text x="430.08000000000004" y="404.15999999999997" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・予定荷受人・配送情報</text><text x="430.08000000000004" y="435.84" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・支払条件</text><text x="430.08000000000004" y="494.4" font-size="14.0" fill="#1670b2" font-weight="700" text-anchor="start">①の仕入先・製品・数量は参照表示です。</text><rect x="786.24" y="158.39999999999998" width="331.20000000000005" height="360.0" rx="7" fill="#edf8f2" stroke="#b0d7c7"/><text x="801.5999999999999" y="194.88" font-size="24.0" fill="#278866" font-weight="700" text-anchor="start">③ 納品・荷受確認</text><text x="801.5999999999999" y="226.88" font-size="17.333333333333332" fill="#527089" font-weight="400" text-anchor="start">実際に何を・いくつ受け取ったか</text><text x="801.5999999999999" y="277.44" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・対象の発注明細</text><text x="801.5999999999999" y="309.12" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・納品実績日・受領数量</text><text x="801.5999999999999" y="340.8" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・実際の荷受人</text><text x="801.5999999999999" y="372.47999999999996" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・使用不可数量</text><text x="801.5999999999999" y="404.15999999999997" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・不足・破損などの確認</text><text x="801.5999999999999" y="435.84" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・備考</text><text x="801.5999999999999" y="494.4" font-size="14.0" fill="#278866" font-weight="700" text-anchor="start">分納のたびに、同じ明細へ追加します。</text><rect x="1157.76" y="158.39999999999998" width="331.20000000000005" height="360.0" rx="7" fill="#edf8f2" stroke="#b0d7c7"/><text x="1173.1200000000001" y="194.88" font-size="24.0" fill="#278866" font-weight="700" text-anchor="start">④ 在庫・引当・出庫</text><text x="1173.1200000000001" y="226.88" font-size="17.333333333333332" fill="#527089" font-weight="400" text-anchor="start">在庫をどの案件に・いくつ使うか</text><text x="1173.1200000000001" y="277.44" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・対象製品・保管場所（選択）</text><text x="1173.1200000000001" y="309.12" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・使用予定案件・予定数量</text><text x="1173.1200000000001" y="340.8" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・確定引当の案件・数量</text><text x="1173.1200000000001" y="372.47999999999996" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・出庫日・数量・出庫担当者</text><text x="1173.1200000000001" y="404.15999999999997" font-size="20.0" fill="#17364d" font-weight="400" text-anchor="start">・必要に応じて引当解除数量</text><text x="1173.1200000000001" y="494.4" font-size="14.0" fill="#278866" font-weight="700" text-anchor="start">実在庫・引当残・利用可能数は自動表示。</text><path d="M374.4,326.4 L408.96,326.4" fill="none" stroke="#7594ab" stroke-width="2" marker-end="url(#arrow-7594ab)"/><path d="M745.92,326.4 L780.4799999999999,326.4" fill="none" stroke="#7594ab" stroke-width="2" marker-end="url(#arrow-7594ab)"/><path d="M1117.44,326.4 L1152.0,326.4" fill="none" stroke="#7594ab" stroke-width="2" marker-end="url(#arrow-7594ab)"/><text x="409.91999999999996" y="141.44000000000003" font-size="13.333333333333334" fill="#527089" font-weight="400" text-anchor="middle">引き継ぐ</text><text x="779.5200000000001" y="141.44000000000003" font-size="13.333333333333334" fill="#527089" font-weight="400" text-anchor="middle">発注後</text><text x="1153.92" y="141.44000000000003" font-size="13.333333333333334" fill="#527089" font-weight="400" text-anchor="middle">倉庫で使用する場合</text><path d="M579.84,518.4000000000001 L579.84,583.6800000000001" fill="none" stroke="#8261b1" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-8261b1)"/><text x="576.96" y="551.0400000000001" font-size="16.0" fill="#8261b1" font-weight="700" text-anchor="middle">前払は、納品前に⑤へ</text><path d="M952.3199999999999,518.4000000000001 L952.3199999999999,583.6800000000001" fill="none" stroke="#8261b1" stroke-width="2" marker-end="url(#arrow-8261b1)"/><text x="954.7199999999998" y="551.0400000000001" font-size="16.0" fill="#8261b1" font-weight="700" text-anchor="middle">請求確認・支払予定は⑤へ</text><rect x="414.72" y="585.5999999999999" width="702.72" height="222.71999999999997" rx="7" fill="#f4effa" stroke="#c8b4df"/><text x="431.04" y="621.12" font-size="24.0" fill="#8261b1" font-weight="700" text-anchor="start">⑤ 請求確認・支払予定</text><text x="432.0" y="665.6" font-size="17.333333333333332" fill="#8261b1" font-weight="700" text-anchor="start">請求情報</text><text x="770.8799999999999" y="665.6" font-size="17.333333333333332" fill="#8261b1" font-weight="700" text-anchor="start">支払予定</text><text x="432.0" y="703.744" font-size="17.06666666666667" fill="#17364d" font-weight="400" text-anchor="start">・対象発注・明細／請求書番号</text><text x="770.8799999999999" y="703.744" font-size="17.06666666666667" fill="#17364d" font-weight="400" text-anchor="start">・一括／前払／残金などの区分</text><text x="432.0" y="734.464" font-size="17.06666666666667" fill="#17364d" font-weight="400" text-anchor="start">・請求日・受領日・確認日</text><text x="770.8799999999999" y="734.464" font-size="17.06666666666667" fill="#17364d" font-weight="400" text-anchor="start">・予定日・予定額・予定の根拠</text><text x="432.0" y="765.184" font-size="17.06666666666667" fill="#17364d" font-weight="400" text-anchor="start">・請求額・購買確認・資料・備考</text><text x="770.8799999999999" y="765.184" font-size="17.06666666666667" fill="#17364d" font-weight="400" text-anchor="start">・対象請求・購買確認・備考</text><rect x="1157.76" y="585.5999999999999" width="331.20000000000005" height="222.71999999999997" rx="7" fill="#fff6e6" stroke="#d9bc83"/><text x="1172.16" y="619.84" font-size="22.666666666666668" fill="#aa7620" font-weight="700" text-anchor="start">随時 ⑥ 移管・変更</text><text x="1172.16" y="652.8000000000001" font-size="14.0" fill="#aa7620" font-weight="400" text-anchor="start">どの区分からも、必要になった時点で</text><text x="1172.16" y="689.28" font-size="16.0" fill="#17364d" font-weight="400" text-anchor="start">・移管区分・製品・数量</text><text x="1172.16" y="712.8" font-size="16.0" fill="#17364d" font-weight="400" text-anchor="start">・移管元／先の案件・保管場所</text><text x="1172.16" y="736.32" font-size="16.0" fill="#17364d" font-weight="400" text-anchor="start">・申請日・予定日・完了日</text><text x="1172.16" y="759.84" font-size="16.0" fill="#17364d" font-weight="400" text-anchor="start">・依頼者・担当者・状況</text><text x="1172.16" y="783.36" font-size="16.0" fill="#17364d" font-weight="400" text-anchor="start">・変更内容・理由・備考</text><rect x="43.2" y="585.5999999999999" width="331.20000000000005" height="222.71999999999997" rx="7" fill="#f7f9fb" stroke="#d7e2ea"/><text x="60.480000000000004" y="622.4" font-size="21.333333333333332" fill="#1670b2" font-weight="700" text-anchor="start">業務に合わせて分岐</text><text x="60.480000000000004" y="674.048" font-size="16.133333333333333" fill="#17364d" font-weight="400" text-anchor="start">在庫購入：①の案件は未指定可</text><text x="60.480000000000004" y="712.4480000000001" font-size="16.133333333333333" fill="#17364d" font-weight="400" text-anchor="start">分納：③を繰り返して入力</text><text x="60.480000000000004" y="750.848" font-size="16.133333333333333" fill="#17364d" font-weight="400" text-anchor="start">現場直送：③で受領し、④は省略</text><text x="45.12" y="844.4800000000001" font-size="14.666666666666666" fill="#527089" font-weight="400" text-anchor="start">※ ①の担当者は自社の購買担当者を想定（仮設定）。⑤は購買側の確認までを扱います。</text></g></svg>